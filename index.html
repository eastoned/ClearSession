<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title> Clear Session 3D </title>
         <style>
            body {
                overflow: hidden;
                margin: 0px;
                user-select: none;
            }
            
            #annotationsPanel {
                position: absolute;
                top: 60px;
                left: 4px;
                width: auto;
                height: auto;
                color: white;
                font-family: monospace;
            }
        </style>
            
    </head>
    <body>
        <div id="annotationsPanel">
            <button id="ColorSwap">Palette Swap</button><br><br>
            <button id="TopButton">Top Down View</button><br>
            <button id="MidButton">Birds Eye View</button><br>
            <button id="LowButton">First Person View</button><br><br>
            <label class="switch">Debug Camera Controls
                <input id="CC" type="checkbox">
            </label>
            <br>
            <label class="switchModel">Show Models
                <input id="ShowModel" type="checkbox">
            </label>
            <br>
            </div>
        <script type="module" src="/scripts/main.js"></script>

    </body>
</html>
